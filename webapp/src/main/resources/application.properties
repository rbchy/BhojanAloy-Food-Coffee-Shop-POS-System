# Server
server.port=${PORT:8080}
server.servlet.session.timeout=30m

# Logging
logging.level.com.bhojanaloy=INFO

# Note: DB connection is NOT read from here. It is read directly from
# environment variables (DB_URL, DB_USER, DB_PASSWORD) inside
# com.bhojanaloy.config.DBConnection, with safe local-dev defaults,
# so the same jar can run unmodified on your laptop or on the VM.
